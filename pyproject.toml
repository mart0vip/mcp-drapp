[project]
name = "mcp-drapp"
version = "0.1.0"
description = "Servidor MCP de solo lectura sobre la HCE de drapp.la"
requires-python = ">=3.11"
dependencies = [
  "mcp>=1.2.0",
  "keyring>=25.0",
  # texto de los adjuntos: capa de PDF y OCR local con Vision de Apple
  "pypdf>=5.0",
  "pyobjc-framework-Vision>=10.0",
  "pyobjc-framework-Quartz>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[project.scripts]
mcp-drapp = "mcp_drapp.server:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["mcp_drapp*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
