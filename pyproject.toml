[project]
name = "mcp-drapp"
version = "0.1.0"
description = "Servidor MCP de solo lectura sobre la HCE de drapp.la"
requires-python = ">=3.11"
dependencies = ["mcp>=1.2.0", "keyring>=25.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["mcp_drapp*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
